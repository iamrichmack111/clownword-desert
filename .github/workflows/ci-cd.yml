name: CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install matching Playwright package
        run: python -m pip install --no-cache-dir playwright==1.63.0

      - name: Validate project files
        run: |
          test -s index.html
          test -s README.md
          python -m py_compile scripts/capture_screenshots.py

      - name: Generate real Playwright screenshots
        run: python scripts/capture_screenshots.py

      - name: Verify screenshots
        run: |
          set -eu
          for file in \
            media/screenshots/01-start-screen.png \
            media/screenshots/02-live-desert.png \
            media/screenshots/03-spelling-combat.png \
            media/screenshots/04-word-controls.png \
            media/screenshots/05-grade-report.png \
            media/screenshots/06-student-records.png; do
            test -s "$file"
            bytes=$(wc -c < "$file")
            test "$bytes" -gt 10000
            echo "verified $file ($bytes bytes)"
          done

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v5
        with:
          name: clownword-desert-playwright-screenshots
          path: media/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
