name: Bug report
description: Report a reproducible problem in the game
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the game
        2. Select Grade 1
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 128 on Linux
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
